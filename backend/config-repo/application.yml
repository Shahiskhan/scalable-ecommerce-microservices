# Non-secret defaults shared as external configuration. Service environments own credentials.
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  shutdown: graceful
  max-http-request-header-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  structured:
    format:
      console: logstash
