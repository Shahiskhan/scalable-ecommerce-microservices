name: Verify independent services
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend/infrastructure/config-server, backend/infrastructure/discovery-server, backend/services/api-gateway, backend/services/user-service, backend/services/product-service, backend/services/order-service, backend/services/payment-service, backend/services/notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Verify
        run: mvn -B -ntp -f ${{ matrix.project }}/pom.xml verify
